syntax = "proto3";
import "nanopb.proto";

// 5 - Alertas e Erros (Máscaras de bits para error_flags)
enum RobotError {
    ERR_NONE = 0;
    ERR_LOW_BATTERY = 1;          // Bit 0 (0x0001): Tensão baixa de bateria
    ERR_CRITICAL_BATTERY = 2;     // Bit 1 (0x0002): Bateria em nível crítico
    ERR_KICKER_OVERVOLTAGE = 4;   // Bit 2 (0x0004): Sobretensão nos capacitores de chute
    ERR_MOTOR_1_STALL = 8;        // Bit 3 (0x0008): Motor 1 travado
    ERR_MOTOR_2_STALL = 16;       // Bit 4 (0x0010): Motor 2 travado
    ERR_MOTOR_3_STALL = 32;       // Bit 5 (0x0020): Motor 3 travado
    ERR_MOTOR_4_STALL = 64;       // Bit 6 (0x0040): Motor 4 travado
    ERR_STM32_TIMEOUT = 128;      // Bit 7 (0x0080): Perda de comunicação UART com STM32
    ERR_IMU_FAIL = 256;           // Bit 8 (0x0100): Falha ou desconexão do MPU-6050
    ERR_ROBOT_FLIPPED = 512;      // Bit 9 (0x0200): Robô tombado/capotado (|roll| ou |pitch| > 60°)
    ERR_BALL_SENSOR_DIRTY = 1024; // Bit 10 (0x0400): Sensor de bola bloqueado continuamente
}

// 0 - Comandos do Computador
message MotionCommand {
    float vel_x = 1;
    float vel_y = 2;
    float vel_w = 3;
    uint32 kick_h = 4;
    uint32 kick_v = 5;
}

// 1 - Comando de Configuração
message ConfigCommand {
    uint32 param_id = 1;
    float value = 2;
    string text_value = 3;
}

// 2 - Solicitar Informação
message InfoRequest {
    uint32 info_index = 1;
}

// 3 - Retorno de Informação
message InfoResponse {
    uint32 info_index = 1;
    float value = 2;       // Usaremos para o Bool (0.0 ou 1.0)
    string text_value = 3;  // Usaremos para IP e MAC
}

// 4 - Telemetria
message Telemetry {
    repeated float wheel_speeds = 1;
    repeated float kicker_voltages = 2;
    float battery_voltage = 3;
    bool ball_sensor = 4;
    float roll = 5;       // Inclinação lateral em radianos [-pi, +pi]
    float pitch = 6;      // Inclinação frontal em radianos [-pi/2, +pi/2]
    float yaw = 7;        // Giro no plano do campo em radianos [-pi, +pi]
    float gyro_z = 8;     // Velocidade angular de rotação em rad/s
    uint32 error_flags = 9; // Máscara de bits (OR dos erros ativos)
}

// MENSAGEM PRINCIPAL (Wrapper)
message RobotPacket {
    uint32 robot_id = 1;
    oneof payload {
        MotionCommand motion = 2;
        ConfigCommand config = 3;
        InfoRequest request = 4;
        InfoResponse response = 5;
        Telemetry telemetry = 6;
        uint32 alert = 7;     // Alerta assíncrono imediato contendo error_flags
    }
    uint32 sequence_id = 8;   // Contador sequencial de pacotes para detecção de perda
}